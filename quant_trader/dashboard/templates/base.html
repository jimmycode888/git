<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}量化交易系统{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<nav>
  <span class="brand">量化交易系统</span>
  <a href="/" id="nav-home">仪表盘</a>
  <a href="/backtest" id="nav-backtest">策略回测</a>
<script>
  (function() {
    var path = window.location.pathname;
    if (path === '/') document.getElementById('nav-home').classList.add('active');
    if (path.startsWith('/backtest')) document.getElementById('nav-backtest').classList.add('active');
  })();
</script>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>
